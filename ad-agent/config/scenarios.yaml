# Planted scenarios. `history: true` ones are active in the 30 pre-generated days.
# All can also be injected live from the UI ("Break something"); a live inject starts
# on the current day and uses `live_duration` days (null = until reset).
# Labels must match the root-cause hypothesis names.
scenarios:
  A:
    name: "Creative fatigue"
    description: "Ad A1 runs a high budget into one small community"
    label: creative_fatigue
    target: {ad: A1}
    effect: {type: budget_multiplier, value: 1.6}   # budget pushed from EUR 25 to EUR 40/day
    history: {start_day: 17, end_day: null}
    eval_ad: A1
    live_effect: {type: budget_multiplier, value: 5.0}   # live: x5 so fatigue shows within ~5 simulated days
    live_duration: null
  B:
    name: "Landing page broke"
    description: "Campaign B landing page health x0.4"
    label: landing_page
    target: {campaign: camp_B}
    effect: {type: landing_health, value: 0.4}
    history: {start_day: 20, end_day: null}
    eval_ad: B1
    live_duration: null
  C:
    name: "Auction pressure"
    description: "Competition x1.6 for campaign C"
    label: auction_pressure
    target: {campaign: camp_C}
    effect: {type: competition, value: 1.6}
    history: {start_day: 18, end_day: null}
    eval_ad: C1
    live_duration: null
  D:
    name: "Seasonal dip"
    description: "All activity x0.75 (market-wide dip)"
    label: seasonality
    target: {all: true}
    effect: {type: activity, value: 0.75}
    history: {start_day: 22, end_day: 25}
    eval_ad: A3
    eval_day: 25
    live_duration: 4
  E:
    name: "Segment saturation"
    description: "Ad D2 delivery skewed into the tech community"
    label: segment_saturation
    target: {ad: D2, pack: tech}
    effect: {type: delivery_skew, value: 6.0}
    history: {start_day: 0, end_day: null}
    eval_ad: D2
    live_duration: null
  F:
    name: "Tracking broke (stretch)"
    description: "Conversion tracking reports 0"
    label: tracking
    target: {campaign: camp_A}
    effect: {type: tracking_off, value: 0}
    history: null
    eval_ad: A3
    live_duration: null
